name: Build Legic Tag Detect (.fap)

on:
  push:
    paths:
      - 'applications_user/legic_tag_detect/**'
      - '.github/workflows/build_app.yml'
  workflow_dispatch:

jobs:
  build_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain + fbt
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build cmake gcc-arm-none-eabi
          pip3 install fbt

      - name: Build .fap
        run: ./fbt APP_DIR=applications_user/legic_tag_detect fap

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: legic_tag_detect
          path: build/**/*.fap
